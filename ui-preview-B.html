<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI方案B - 暗黑神秘風</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Noto Sans TC', sans-serif; background: #0a0a0f; color: #eee; min-height:100vh; display:flex; justify-content:center; }
.phone { width:390px; min-height:844px; background:#08080e; position:relative; overflow:hidden; border:2px solid #333; border-radius:40px; margin:20px; }
.status-bar { height:50px; }

/* Style B: Dark mystery theme */
.top-b {
  padding: 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(108,92,231,0.15) 0%, transparent 70%);
}
.greeting-b { font-size: 13px; color: #555; }
.greeting-b span { color: #a29bfe; }
.title-b { font-size: 28px; font-weight: 800; margin-top: 4px; }
.title-b span { color: #00b894; }

.daily-b {
  margin: 16px 20px; padding: 20px;
  background: linear-gradient(135deg, #1a1030, #0d1a2e);
  border-radius: 20px; border: 1px solid rgba(108,92,231,0.3);
  position: relative; overflow: hidden;
}
.daily-b::after {
  content: '🐢'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
  font-size: 60px; opacity: 0.15;
}
.daily-b .tag { font-size: 11px; color: #a29bfe; background: rgba(108,92,231,0.2); padding: 4px 10px; border-radius: 8px; display: inline-block; }
.daily-b .q { font-size: 15px; margin-top: 10px; line-height: 1.7; color: #ccc; }
.daily-b .btn { margin-top: 14px; padding: 10px 20px; background: #6c5ce7; border-radius: 12px; display: inline-block; font-size: 13px; font-weight: 600; }

.progress-b {
  margin: 0 20px; padding: 16px 20px;
  background: #12121a; border-radius: 16px;
  display: flex; align-items: center; gap: 14px;
  border: 1px solid #1e1e2e;
}
.progress-b .ring {
  width: 50px; height: 50px; border-radius: 50%;
  border: 3px solid #2a2a3a; border-top-color: #6c5ce7;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #a29bfe;
}
.progress-b .info .t { font-size: 14px; font-weight: 600; }
.progress-b .info .d { font-size: 12px; color: #555; margin-top: 2px; }
.progress-b .bar { flex:1; height:4px; background:#1e1e2e; border-radius:2px; overflow:hidden; }
.progress-b .bar-fill { height:100%; width:6%; background: linear-gradient(90deg, #6c5ce7, #00b894); border-radius:2px; }

.grid-b {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 20px;
}
.grid-b .card {
  padding: 20px 16px; border-radius: 18px;
  border: 1px solid #1e1e2e;
  position: relative; overflow: hidden;
}
.grid-b .card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.grid-b .card:nth-child(1) { background: linear-gradient(180deg, rgba(108,92,231,0.1), transparent); }
.grid-b .card:nth-child(1)::before { background: #6c5ce7; }
.grid-b .card:nth-child(2) { background: linear-gradient(180deg, rgba(0,184,148,0.1), transparent); }
.grid-b .card:nth-child(2)::before { background: #00b894; }
.grid-b .card:nth-child(3) { background: linear-gradient(180deg, rgba(225,112,85,0.1), transparent); }
.grid-b .card:nth-child(3)::before { background: #e17055; }
.grid-b .card:nth-child(4) { background: linear-gradient(180deg, rgba(253,203,110,0.1), transparent); }
.grid-b .card:nth-child(4)::before { background: #fdcb6e; }
.grid-b .card .emoji { font-size: 32px; }
.grid-b .card .name { font-size: 15px; font-weight: 700; margin-top: 10px; }
.grid-b .card .cnt { font-size: 12px; color: #555; margin-top: 4px; }

.cats-b { padding: 0 20px 20px; }
.cats-b h3 { font-size: 13px; color: #555; margin-bottom: 10px; letter-spacing: 2px; }
.cat-list-b { display: flex; flex-direction: column; gap: 8px; }
.cat-item-b {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: #12121a; border-radius: 14px;
  border: 1px solid #1a1a2a;
}
.cat-item-b .e { font-size: 24px; }
.cat-item-b .n { flex:1; font-size: 14px; font-weight: 600; }
.cat-item-b .c { font-size: 12px; color: #555; }
.cat-item-b .arrow { color: #333; }

.label { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:#00b894; padding:8px 20px; border-radius:20px; font-size:14px; font-weight:700; z-index:999; color:#000; }
</style>
</head>
<body>
<div class="label">方案 B：暗黑神秘風 + 每日精選</div>
<div class="phone">
  <div class="status-bar"></div>
  <div class="top-b">
    <div class="greeting-b">歡迎回來，<span>偵探</span></div>
    <div class="title-b">海龜<span>湯</span></div>
  </div>

  <div class="daily-b">
    <div class="tag">🔮 今日精選</div>
    <div class="q">女子每晚睡前都會檢查床底，確認沒有人後才安心入睡。今天她檢查完，卻再也睡不著了。</div>
    <div class="btn">開始推理 →</div>
  </div>

  <div class="progress-b">
    <div class="ring">6%</div>
    <div class="info" style="flex:1">
      <div class="t">探案進度</div>
      <div class="d">已解 12 / 186 題</div>
      <div class="bar" style="margin-top:8px"><div class="bar-fill"></div></div>
    </div>
  </div>

  <div class="grid-b">
    <div class="card"><div class="emoji">🟢</div><div class="name">短篇</div><div class="cnt">70 題</div></div>
    <div class="card"><div class="emoji">🟡</div><div class="name">中篇</div><div class="cnt">65 題</div></div>
    <div class="card"><div class="emoji">🔴</div><div class="name">長篇</div><div class="cnt">51 題</div></div>
    <div class="card"><div class="emoji">🎲</div><div class="name">隨機</div><div class="cnt">試試手氣</div></div>
  </div>

  <div class="cats-b">
    <h3>📂 題目分類</h3>
    <div class="cat-list-b">
      <div class="cat-item-b"><span class="e">🥰</span><span class="n">溫馨感人</span><span class="c">24題</span><span class="arrow">›</span></div>
      <div class="cat-item-b"><span class="e">🔍</span><span class="n">推理偵探</span><span class="c">22題</span><span class="arrow">›</span></div>
      <div class="cat-item-b"><span class="e">👻</span><span class="n">恐怖驚悚</span><span class="c">18題</span><span class="arrow">›</span></div>
      <div class="cat-item-b"><span class="e">😄</span><span class="n">搞笑幽默</span><span class="c">16題</span><span class="arrow">›</span></div>
    </div>
  </div>
</div>
</body>
</html>
