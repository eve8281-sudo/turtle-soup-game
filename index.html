<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海龜湯 - 情境猜謎</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="海龜湯">
<meta name="theme-color" content="#0f1923">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="puzzles.js"></script>
<style>
:root {
  --bg: #0f1923;
  --bg-card: #141e2b;
  --bg-card-hover: #1a2838;
  --bg-input: #141e2b;
  --accent: #ffd93d;
  --accent-dim: rgba(255,217,61,0.15);
  --purple: #6c5ce7;
  --purple-light: #a29bfe;
  --teal: #00b894;
  --text: #e8e8e8;
  --text2: #7a8a9e;
  --text3: #4a5568;
  --yes: #00b894;
  --no: #e17055;
  --irr: #636e72;
  --border: #1e2d40;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes typing { 0%{opacity:.3} 50%{opacity:1} 100%{opacity:.3} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.fade-in { animation: fadeIn 0.4s ease; }

/* ===== HEADER ===== */
.header {
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; background: rgba(15,25,35,0.95);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.header-logo { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.header-logo img { width: 28px; height: 28px; border-radius: 6px; }
.header-logo span { color: var(--accent); }
.back-btn {
  background: none; border: none; color: var(--text2); font-size: 22px;
  cursor: pointer; padding: 4px 8px; transition: color 0.2s;
}
.back-btn:hover { color: var(--text); }

/* ===== HOME: BANNER ===== */
.home { padding: 0 20px 30px; }
.banner {
  margin-top: 16px; padding: 28px 24px; border-radius: 24px;
  background: linear-gradient(135deg, #1a2840, #0f1923);
  border: 1px solid rgba(255,217,61,0.12);
  position: relative; overflow: hidden;
}
.banner-deco { position: absolute; top: 12px; right: 16px; font-size: 32px; opacity: 0.25; animation: float 3s ease-in-out infinite; }
.banner h2 { font-size: 26px; font-weight: 800; line-height: 1.4; }
.banner h2 span { color: var(--accent); }
.banner .sub { font-size: 13px; color: var(--text2); margin-top: 8px; }
.banner-btn {
  margin-top: 18px; display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 26px; background: var(--accent); color: #000; border-radius: 14px;
  font-size: 15px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s;
}
.banner-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,217,61,0.3); }

/* ===== QUICK START ===== */
.section-label { font-size: 13px; color: var(--text3); margin: 22px 0 10px; letter-spacing: 1px; font-weight: 600; }
.quick-grid { display: flex; gap: 10px; }
.quick-card {
  flex: 1; padding: 16px 8px; text-align: center;
  background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s;
}
.quick-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.quick-card .emoji { font-size: 26px; }
.quick-card .name { font-size: 12px; color: var(--text2); margin-top: 6px; }
.quick-card .num { font-size: 20px; font-weight: 800; color: var(--accent); margin-top: 2px; }

/* ===== TABS ===== */
.tabs {
  display: flex; gap: 0; margin: 20px 0 14px; background: var(--bg-card);
  border-radius: 14px; padding: 4px; border: 1px solid var(--border);
}
.tab {
  flex: 1; padding: 10px; text-align: center; border-radius: 12px;
  font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer;
  transition: all 0.2s; border: none; background: none;
}
.tab.active { background: var(--border); color: var(--accent); }

/* ===== STORY CARDS ===== */
.story-list { display: flex; flex-direction: column; gap: 12px; }
.story-card {
  padding: 18px; background: var(--bg-card); border-radius: 18px;
  border-left: 4px solid var(--purple); cursor: pointer;
  transition: all 0.2s; border-right: 1px solid var(--border);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.story-card:hover { background: var(--bg-card-hover); transform: translateX(4px); }
.story-card.solved { opacity: 0.45; }
.story-card .meta { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.story-card .tag {
  font-size: 11px; padding: 3px 10px; border-radius: 8px;
  background: rgba(108,92,231,0.15); color: var(--purple-light);
}
.story-card .tag.cat { background: rgba(0,184,148,0.12); color: var(--teal); }
.story-card .solved-badge { font-size: 11px; color: var(--yes); margin-left: auto; }
.story-card .preview {
  font-size: 14px; line-height: 1.7; color: var(--text2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.story-card .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.story-card .diff { font-size: 11px; color: var(--text3); }
.play-icon {
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--accent);
}

/* ===== CATEGORY CHIPS ===== */
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  flex-shrink: 0; padding: 10px 16px; border-radius: 25px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-size: 13px; white-space: nowrap; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: all 0.2s;
}
.cat-chip:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.cat-chip .e { font-size: 16px; }

/* ===== GAME SCREEN ===== */
.game { padding: 20px; padding-bottom: 100px; }
.soup-card {
  background: linear-gradient(135deg, #1a2840, var(--bg-card));
  border-radius: 20px; padding: 24px; margin-bottom: 20px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.soup-label { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
.soup-text { font-size: 16px; line-height: 1.9; }

.game-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.question-count { font-size: 13px; color: var(--text3); }
.hint-btn {
  background: var(--accent-dim); border: 1px solid rgba(255,217,61,0.3);
  color: var(--accent); padding: 7px 16px; border-radius: 20px;
  font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 600;
}
.hint-btn:hover { background: var(--accent); color: #000; }
.hint-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.chat-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.msg {
  max-width: 85%; padding: 12px 16px; border-radius: 16px;
  font-size: 14px; line-height: 1.6; animation: fadeIn 0.3s ease;
}
.msg.user {
  align-self: flex-end; background: var(--purple);
  color: white; border-bottom-right-radius: 4px;
}
.msg.system {
  align-self: flex-start; background: var(--bg-card);
  border: 1px solid var(--border); border-bottom-left-radius: 4px;
}
.msg.yes { border-left: 3px solid var(--yes); }
.msg.no { border-left: 3px solid var(--no); }
.msg.irrelevant { border-left: 3px solid var(--irr); }
.msg .answer-tag { font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block; }
.msg .answer-tag.yes { color: var(--yes); }
.msg .answer-tag.no { color: var(--no); }
.msg .answer-tag.irrelevant { color: var(--irr); }

.typing-indicator {
  align-self: flex-start; background: var(--bg-card);
  border: 1px solid var(--border); padding: 12px 20px;
  border-radius: 16px; display: flex; gap: 6px;
}
.typing-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text3); animation: typing 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

.hint-card {
  background: var(--accent-dim); border: 1px solid rgba(255,217,61,0.25);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; animation: fadeIn 0.3s ease;
}
.hint-card .hint-label { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.hint-card .hint-text { font-size: 14px; line-height: 1.6; color: var(--text); }

.guess-btn {
  width: 100%; padding: 15px; border-radius: 14px;
  background: linear-gradient(135deg, #e17055, #d63031);
  border: none; color: white; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 10px; transition: all 0.2s;
}
.guess-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(214,48,49,0.3); }

.reveal-card {
  background: linear-gradient(135deg, #1a2840, #0f1923);
  border-radius: 20px; padding: 24px; border: 1px solid var(--accent);
  animation: slideUp 0.5s ease; box-shadow: 0 0 30px rgba(255,217,61,0.1);
}
.reveal-label { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
.reveal-text { font-size: 15px; line-height: 1.8; }
.reveal-actions { display: flex; gap: 10px; margin-top: 20px; }
.reveal-btn {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.reveal-btn.primary { background: var(--accent); color: #000; }
.reveal-btn.secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.reveal-btn:hover { transform: translateY(-2px); }

.input-area {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; padding: 12px 20px 28px;
  background: linear-gradient(transparent, var(--bg) 20%);
}
.input-row { display: flex; gap: 8px; }
.input-row input {
  flex: 1; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 24px; padding: 14px 20px;
  color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--text3); }
.send-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); border: none; color: #000;
  font-size: 18px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ============ GEMINI API ============
const _dk = [65,73,122,97,83,121,68,65,103,112,85,75,70,113,55,117,111,111,75,49,86,117,118,53,111,53,102,107,65,67,75,80,73,102,53,54,45,103,119];
const getKey = () => { try { const k = localStorage.getItem('ts_k'); if(k) return k; } catch(e){} return _dk.map(c=>String.fromCharCode(c)).join(''); };
const MODEL = 'gemini-2.5-flash';
const getApiUrl = () => `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${getKey()}`;

const callGemini = async (puzzle, userQuestion, chatHistory) => {
  const systemPrompt = `你是一個海龜湯遊戲的主持人。

遊戲規則：
- 玩家看到「湯面」（謎題表面描述），需要透過提問來推理出「湯底」（真相）
- 你只能回答：「是 ✓」「不是 ✗」「無關」這三種
- 如果玩家的問題無法用是/否回答，引導他重新提問
- 不要透露湯底的任何細節
- 保持神秘感，偶爾可以加一句簡短的引導語

湯面：${puzzle.question}
湯底（機密，絕對不能透露）：${puzzle.answer}

根據湯底來判斷玩家的問題，回答「是 ✓」「不是 ✗」或「無關」。
回答格式：先寫判斷（是 ✓ / 不是 ✗ / 無關），然後可以加一句簡短引導（20字以內）。`;

  const messages = chatHistory.map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.text }]
  }));
  messages.push({ role: 'user', parts: [{ text: userQuestion }] });

  const res = await fetch(getApiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: messages,
      generationConfig: { temperature: 0.3, maxOutputTokens: 1024 }
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const pp = data.candidates[0].content.parts; return pp.filter(p => p.text).pop().text;
};

const getHint = async (puzzle, questionCount) => {
  const prompt = `你是海龜湯遊戲主持人，玩家已經問了${questionCount}個問題還沒猜出來。
湯面：${puzzle.question}
湯底：${puzzle.answer}

你必須根據湯底的內容，給玩家一個有意義的提示。提示必須和湯底有直接關聯，能幫助玩家猜到真相。

規則：
1. 提示必須和湯底的核心真相有關，引導玩家往正確方向思考
2. 不能直接說出湯底的答案，但要暗示關鍵線索
3. 用一句完整的中文句子回答，15到30個字
4. 只輸出提示本身，不要加任何前綴如「提示：」「好的」等`;

  const res = await fetch(getApiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const parts = data.candidates[0].content.parts;
  return parts.filter(p => p.text).pop().text;
};

const judgeAnswer = async (puzzle, playerAnswer) => {
  const prompt = `你是海龜湯遊戲的裁判。

湯面：${puzzle.question}
湯底（正確答案）：${puzzle.answer}
玩家的猜測：${playerAnswer}

請判斷玩家的猜測是否接近正確答案。判斷標準：
- 玩家不需要完全說出一模一樣的答案，只要猜到了核心真相或關鍵要素就算正確
- 如果玩家猜到了大部分重點但有些細節不對，算「接近」
- 如果完全偏離，算「錯誤」

請用以下格式回答（只選一個）：
🎉 正確！[一句話簡短說明為什麼對]
🤏 很接近！[一句話說明哪裡對了，還差什麼]
❌ 還沒猜到！[一句話簡短引導，不要透露答案]

只輸出上面一行，不要多說。`;

  const res = await fetch(getApiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 1024 }
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const pp = data.candidates[0].content.parts; return pp.filter(p => p.text).pop().text;
};

// ============ CATEGORY CONFIG ============
const CAT = {
  '溫馨感人': { emoji: '🥰', color: '#fdcb6e' },
  '懸疑推理': { emoji: '🔍', color: '#74b9ff' },
  '恐怖驚悚': { emoji: '👻', color: '#d63031' },
  '搞笑幽默': { emoji: '😂', color: '#00b894' },
  '悲劇感人': { emoji: '😢', color: '#636e72' },
  '愛情浪漫': { emoji: '💕', color: '#e84393' },
  '心理驚悚': { emoji: '🧠', color: '#6c5ce7' },
  '家庭親情': { emoji: '👨‍👩‍👧', color: '#fdcb6e' },
  '職場怪事': { emoji: '💼', color: '#00cec9' },
  '犯罪推理': { emoji: '🔪', color: '#d63031' },
  '校園奇談': { emoji: '🏫', color: '#0984e3' },
  '科幻奇幻': { emoji: '🚀', color: '#a29bfe' },
  '黑色幽默': { emoji: '🖤', color: '#2d3436' },
  '日常怪談': { emoji: '🏠', color: '#ffeaa7' },
  '靈異事件': { emoji: '👁️', color: '#fd79a8' },
};

const BORDER_COLORS = ['#e17055','#6c5ce7','#00b894','#ffd93d','#fd79a8','#74b9ff','#a29bfe','#fdcb6e'];

// ============ COMPONENTS ============

function Header({ title, onBack }) {
  return (
    <div className="header">
      {onBack ? <button className="back-btn" onClick={onBack}>←</button> : <div style={{width:36}}/>}
      <div className="header-logo">
        <img src="logo.png" alt="logo" />
        <span>{title || '海龜湯'}</span>
      </div>
      <div style={{width:36}}/>
    </div>
  );
}

function HomeScreen({ onSelectCategory, onSelectDifficulty, onRandomPlay, solvedIds }) {
  const [tab, setTab] = useState('recommend');
  const totalSolved = solvedIds.size;

  const categories = {};
  PUZZLES.forEach(p => {
    if (!categories[p.category]) categories[p.category] = [];
    categories[p.category].push(p);
  });

  const getRecommended = () => {
    const unsolved = PUZZLES.filter(p => !solvedIds.has(p.id));
    const pool = unsolved.length > 0 ? unsolved : PUZZLES;
    return pool.sort(() => Math.random() - 0.5).slice(0, 10);
  };

  const [recommended] = useState(getRecommended);

  const getDisplayList = () => {
    if (tab === 'recommend') return recommended;
    if (tab === 'easy') return PUZZLES.filter(p => p.difficulty === 'easy');
    if (tab === 'medium') return PUZZLES.filter(p => p.difficulty === 'medium');
    if (tab === 'hard') return PUZZLES.filter(p => p.difficulty === 'hard');
    return recommended;
  };

  return (
    <div className="home fade-in">
      <div className="banner">
        <div className="banner-deco">✨🌙</div>
        <h2>今晚<span>來解</span><br/>一個謎題？</h2>
        <div className="sub">{PUZZLES.length} 道謎題等你挑戰 · 已解開 {totalSolved} 題</div>
        <button className="banner-btn" onClick={onRandomPlay}>🎲 隨機開始</button>
      </div>

      <div className="section-label">⚡ 快速開始</div>
      <div className="quick-grid">
        <div className="quick-card" onClick={() => onSelectDifficulty('easy')}>
          <div className="emoji">🟢</div><div className="name">短篇</div><div className="num">70</div>
        </div>
        <div className="quick-card" onClick={() => onSelectDifficulty('medium')}>
          <div className="emoji">🟡</div><div className="name">中篇</div><div className="num">65</div>
        </div>
        <div className="quick-card" onClick={() => onSelectDifficulty('hard')}>
          <div className="emoji">🔴</div><div className="name">長篇</div><div className="num">51</div>
        </div>
        <div className="quick-card" onClick={onRandomPlay}>
          <div className="emoji">⭐</div><div className="name">已解</div><div className="num">{totalSolved}</div>
        </div>
      </div>

      <div className="section-label">📂 分類瀏覽</div>
      <div className="cat-scroll">
        {Object.entries(categories).sort((a,b) => b[1].length - a[1].length).map(([cat, items]) => (
          <div key={cat} className="cat-chip" onClick={() => onSelectCategory(cat)}>
            <span className="e">{(CAT[cat]||{}).emoji || '❓'}</span>
            {cat} ({items.length})
          </div>
        ))}
      </div>

      <div className="tabs">
        {[
          { key: 'recommend', label: '推薦' },
          { key: 'easy', label: '短篇' },
          { key: 'medium', label: '中篇' },
          { key: 'hard', label: '長篇' },
        ].map(t => (
          <button key={t.key} className={`tab ${tab===t.key?'active':''}`} onClick={() => setTab(t.key)}>
            {t.label}
          </button>
        ))}
      </div>

      <div className="story-list">
        {getDisplayList().map((p, i) => (
          <StoryCard key={p.id} puzzle={p} index={i} solved={solvedIds.has(p.id)} onClick={() => onRandomPlay(p)} />
        ))}
      </div>
    </div>
  );
}

function StoryCard({ puzzle, index, solved, onClick }) {
  const borderColor = BORDER_COLORS[index % BORDER_COLORS.length];
  const diffLabel = puzzle.difficulty === 'easy' ? '短篇' : puzzle.difficulty === 'medium' ? '中篇' : '長篇';
  return (
    <div className={`story-card ${solved?'solved':''}`} style={{borderLeftColor: borderColor}} onClick={onClick}>
      <div className="meta">
        <span className="tag">{(CAT[puzzle.category]||{}).emoji} {puzzle.category}</span>
        <span className="tag cat">{puzzle.type}</span>
        {solved && <span className="solved-badge">✓ 已解</span>}
      </div>
      <div className="preview">{puzzle.question}</div>
      <div className="bottom">
        <span className="diff">{diffLabel}</span>
        <div className="play-icon">▶</div>
      </div>
    </div>
  );
}

function PuzzleListScreen({ title, puzzles, onSelect, onBack, solvedIds }) {
  return (
    <div className="fade-in">
      <Header title={title} onBack={onBack} />
      <div style={{padding:20}}>
        <div className="story-list">
          {puzzles.map((p, i) => (
            <StoryCard key={p.id} puzzle={p} index={i} solved={solvedIds.has(p.id)} onClick={() => onSelect(p)} />
          ))}
        </div>
      </div>
    </div>
  );
}

function GameScreen({ puzzle, onBack, onSolved }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const [hints, setHints] = useState([]);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [guessMode, setGuessMode] = useState(false);
  const [guessInput, setGuessInput] = useState('');
  const [guessResult, setGuessResult] = useState(null);
  const [won, setWon] = useState(false);
  const chatRef = useRef(null);
  const maxHints = puzzle.difficulty === 'easy' ? 2 : puzzle.difficulty === 'medium' ? 3 : 4;

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages, hints, loading, guessResult]);

  const parseAnswer = (text) => {
    const t = text.trim();
    if (t.startsWith('是') || t.includes('是 ✓')) return 'yes';
    if (t.startsWith('不是') || t.startsWith('不') || t.includes('不是 ✗')) return 'no';
    if (t.includes('無關')) return 'irrelevant';
    return 'irrelevant';
  };

  const handleSend = async () => {
    const q = input.trim();
    if (!q || loading) return;
    setInput('');
    setMessages(prev => [...prev, { role: 'user', text: q }]);
    setLoading(true);
    try {
      const history = messages.map(m => ({ role: m.role, text: m.text }));
      const reply = await callGemini(puzzle, q, history);
      setMessages(prev => [...prev, { role: 'system', text: reply, type: parseAnswer(reply) }]);
    } catch (err) {
      setMessages(prev => [...prev, { role: 'system', text: `出錯了：${err.message}`, type: 'irrelevant' }]);
    }
    setLoading(false);
  };

  const handleHint = async () => {
    if (hintsUsed >= maxHints || loading) return;
    setLoading(true);
    try {
      const hint = await getHint(puzzle, messages.filter(m=>m.role==='user').length);
      setHints(prev => [...prev, hint]);
      setHintsUsed(prev => prev + 1);
    } catch(e) { setHints(prev => [...prev, '提示獲取失敗：' + e.message]); }
    setLoading(false);
  };

  const handleGuess = async () => {
    const g = guessInput.trim();
    if (!g || loading) return;
    setLoading(true);
    setGuessResult(null);
    try {
      const result = await judgeAnswer(puzzle, g);
      setGuessResult(result);
      setMessages(prev => [...prev,
        { role: 'user', text: `【猜答案】${g}` },
        { role: 'system', text: result, type: result.includes('🎉') ? 'yes' : result.includes('🤏') ? 'irrelevant' : 'no' }
      ]);
      if (result.includes('🎉')) {
        setWon(true);
        onSolved(puzzle.id);
      }
    } catch (err) {
      setGuessResult(`出錯了：${err.message}`);
    }
    setLoading(false);
    setGuessInput('');
    setGuessMode(false);
  };

  const questionCount = messages.filter(m => m.role === 'user').length;

  return (
    <div className="fade-in">
      <Header title={`${puzzle.type} #${puzzle.number.split('#')[1]}`} onBack={onBack} />
      <div className="game" ref={chatRef} style={{overflowY:'auto', maxHeight:'calc(100vh - 130px)'}}>
        <div className="soup-card">
          <div className="soup-label">🍲 湯面</div>
          <div className="soup-text">{puzzle.question}</div>
        </div>

        <div className="game-info">
          <span className="question-count">已提問 {questionCount} 次</span>
          <button className="hint-btn" onClick={handleHint} disabled={hintsUsed >= maxHints || loading}>
            💡 提示 ({hintsUsed}/{maxHints})
          </button>
        </div>

        {hints.map((h, i) => (
          <div key={i} className="hint-card">
            <div className="hint-label">💡 提示 {i+1}</div>
            <div className="hint-text">{h}</div>
          </div>
        ))}

        <div className="chat-area">
          {messages.map((m, i) => (
            <div key={i} className={`msg ${m.role} ${m.type || ''}`}>
              {m.type && m.role === 'system' && (
                <span className={`answer-tag ${m.type}`}>
                  {m.type === 'yes' ? '是 ✓' : m.type === 'no' ? '不是 ✗' : '無關'}
                </span>
              )}
              {m.text}
            </div>
          ))}
          {loading && (
            <div className="typing-indicator">
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
            </div>
          )}
        </div>

        {!revealed && !won && (
          <div style={{display:'flex', gap:10, marginTop:10, alignItems:'stretch'}}>
            <button onClick={() => setGuessMode(!guessMode)} style={{
              flex:1, padding:'14px 16px', borderRadius:14, border:'none', fontSize:14, fontWeight:700,
              background:'linear-gradient(135deg, #ffd93d, #f0c929)', color:'#000', cursor:'pointer', transition:'all 0.2s'
            }}>
              🧠 {guessMode ? '取消' : '我知道答案了'}
            </button>
            <button onClick={() => { setRevealed(true); onSolved(puzzle.id); }} style={{
              padding:'14px 20px', borderRadius:14, border:'1px solid var(--border)', fontSize:14, fontWeight:600,
              background:'var(--bg-card)', color:'var(--text2)', cursor:'pointer', transition:'all 0.2s'
            }}>
              🔓 揭曉
            </button>
          </div>
        )}

        {guessMode && !revealed && !won && (
          <div style={{marginTop:12, animation:'fadeIn 0.3s ease'}}>
            <div style={{fontSize:13, color:'var(--accent)', marginBottom:8, fontWeight:600}}>✍️ 寫下你認為的湯底：</div>
            <div style={{display:'flex', gap:8}}>
              <textarea
                value={guessInput}
                onChange={e => setGuessInput(e.target.value)}
                placeholder="描述你猜到的真相..."
                style={{
                  flex:1, background:'var(--bg-card)', border:'1px solid var(--accent)',
                  borderRadius:14, padding:'12px 16px', color:'var(--text)', fontSize:14,
                  outline:'none', resize:'none', minHeight:80, fontFamily:'inherit', lineHeight:1.6
                }}
              />
            </div>
            <button
              onClick={handleGuess}
              disabled={loading || !guessInput.trim()}
              style={{
                width:'100%', marginTop:10, padding:14, borderRadius:12,
                background: guessInput.trim() ? 'var(--accent)' : 'var(--border)',
                border:'none', color:'#000', fontSize:15, fontWeight:700,
                cursor: guessInput.trim() ? 'pointer' : 'not-allowed',
                transition:'all 0.2s'
              }}
            >
              {loading ? '判定中...' : '提交答案'}
            </button>
          </div>
        )}

        {won && !revealed && (
          <div className="reveal-card" style={{marginTop:16, borderColor:'var(--yes)'}}>
            <div className="reveal-label" style={{color:'var(--yes)'}}>🎉 恭喜猜對了！</div>
            <div className="reveal-text">{puzzle.answer}</div>
            <div style={{marginTop:12, fontSize:13, color:'var(--text2)'}}>
              你用了 {questionCount} 次提問就猜到了答案！
            </div>
            <div className="reveal-actions">
              <button className="reveal-btn secondary" onClick={onBack}>返回列表</button>
              <button className="reveal-btn primary" onClick={() => {
                const unsolved = PUZZLES.filter(p => p.id !== puzzle.id);
                const next = unsolved[Math.floor(Math.random() * unsolved.length)];
                if (next) { setMessages([]); setHints([]); setHintsUsed(0); setRevealed(false); setWon(false); setInput(''); setGuessMode(false); setGuessResult(null); window.__loadPuzzle?.(next); }
              }}>下一題 →</button>
            </div>
          </div>
        )}

        {revealed && (
          <div className="reveal-card">
            <div className="reveal-label">🔮 湯底揭曉</div>
            <div className="reveal-text">{puzzle.answer}</div>
            <div className="reveal-actions">
              <button className="reveal-btn secondary" onClick={onBack}>返回列表</button>
              <button className="reveal-btn primary" onClick={() => {
                const unsolved = PUZZLES.filter(p => p.id !== puzzle.id);
                const next = unsolved[Math.floor(Math.random() * unsolved.length)];
                if (next) { setMessages([]); setHints([]); setHintsUsed(0); setRevealed(false); setWon(false); setInput(''); setGuessMode(false); setGuessResult(null); window.__loadPuzzle?.(next); }
              }}>下一題 →</button>
            </div>
          </div>
        )}
      </div>

      {!revealed && !won && !guessMode && (
        <div className="input-area">
          <div className="input-row">
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="輸入你的問題..." disabled={loading} />
            <button className="send-btn" onClick={handleSend} disabled={loading || !input.trim()}>➤</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ APP ============
function App() {
  const [screen, setScreen] = useState('home');
  const [currentPuzzle, setCurrentPuzzle] = useState(null);
  const [listTitle, setListTitle] = useState('');
  const [listPuzzles, setListPuzzles] = useState([]);
  const [solvedIds, setSolvedIds] = useState(() => {
    try { const s = localStorage.getItem('turtle_soup_solved'); return s ? new Set(JSON.parse(s)) : new Set(); } catch { return new Set(); }
  });

  const markSolved = (id) => {
    const ns = new Set(solvedIds); ns.add(id);
    setSolvedIds(ns);
    try { localStorage.setItem('turtle_soup_solved', JSON.stringify([...ns])); } catch {}
  };

  const startGame = (puzzle) => { setCurrentPuzzle(puzzle); setScreen('game'); };
  window.__loadPuzzle = startGame;

  const randomPlay = (puzzle) => {
    if (puzzle && puzzle.id) { startGame(puzzle); return; }
    const unsolved = PUZZLES.filter(p => !solvedIds.has(p.id));
    const pool = unsolved.length > 0 ? unsolved : PUZZLES;
    startGame(pool[Math.floor(Math.random() * pool.length)]);
  };

  return (
    <div className="app">
      {screen === 'home' && (
        <React.Fragment>
          <Header />
          <HomeScreen
            onSelectCategory={(cat) => { setListTitle(cat); setListPuzzles(PUZZLES.filter(p => p.category === cat)); setScreen('list'); }}
            onSelectDifficulty={(d) => { const l = {easy:'短篇',medium:'中篇',hard:'長篇'}; setListTitle(l[d]); setListPuzzles(PUZZLES.filter(p => p.difficulty === d)); setScreen('list'); }}
            onRandomPlay={randomPlay}
            solvedIds={solvedIds}
          />
        </React.Fragment>
      )}
      {screen === 'list' && (
        <PuzzleListScreen title={listTitle} puzzles={listPuzzles} onSelect={startGame} onBack={() => setScreen('home')} solvedIds={solvedIds} />
      )}
      {screen === 'game' && currentPuzzle && (
        <GameScreen key={currentPuzzle.id} puzzle={currentPuzzle} onBack={() => setScreen('home')} onSolved={markSolved} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
