<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海龜湯 - 情境猜謎</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="海龜湯">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="puzzles.js"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-card: #16161f;
  --bg-card-hover: #1e1e2a;
  --bg-input: #1a1a26;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-glow: rgba(108,92,231,0.3);
  --text-primary: #eee;
  --text-secondary: #888;
  --text-dim: #555;
  --yes-color: #00b894;
  --no-color: #e17055;
  --irrelevant-color: #636e72;
  --border: #2a2a3a;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

/* Animations */
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
@keyframes glow { 0%,100%{box-shadow:0 0 5px var(--accent-glow)} 50%{box-shadow:0 0 20px var(--accent-glow)} }
@keyframes typing { 0%{opacity:.3} 50%{opacity:1} 100%{opacity:.3} }
@keyframes ripple { to{transform:scale(2);opacity:0} }

.fade-in { animation: fadeIn 0.4s ease; }
.slide-up { animation: slideUp 0.5s ease; }

/* Header */
.header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,15,0.9);
}
.header-title { font-size: 18px; font-weight: 700; }
.header-title span { color: var(--accent-light); }
.back-btn {
  background: none; border: none; color: var(--text-secondary);
  font-size: 24px; cursor: pointer; padding: 4px 8px;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--text-primary); }

/* Home Screen */
.home { padding: 20px; }
.hero {
  text-align: center; padding: 40px 0 30px;
}
.hero-icon { font-size: 64px; margin-bottom: 12px; }
.hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.hero h1 span { color: var(--accent-light); }
.hero p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

.stats-bar {
  display: flex; gap: 8px; margin: 20px 0;
}
.stat-item {
  flex: 1; background: var(--bg-card); border-radius: 12px;
  padding: 14px 10px; text-align: center;
  border: 1px solid var(--border);
}
.stat-num { font-size: 22px; font-weight: 800; color: var(--accent-light); }
.stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.section-title {
  font-size: 16px; font-weight: 700; margin: 24px 0 12px;
  display: flex; align-items: center; gap: 8px;
}

/* Category Cards */
.category-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.category-card {
  background: var(--bg-card); border-radius: 14px;
  padding: 16px; cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.25s ease;
  position: relative; overflow: hidden;
}
.category-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(108,92,231,0.15);
}
.category-card .emoji { font-size: 28px; margin-bottom: 8px; }
.category-card .name { font-size: 14px; font-weight: 600; }
.category-card .count { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Difficulty Selector */
.difficulty-row {
  display: flex; gap: 8px; margin: 16px 0;
}
.diff-btn {
  flex: 1; padding: 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-primary); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; text-align: center;
}
.diff-btn:hover { border-color: var(--accent); }
.diff-btn.active { background: var(--accent); border-color: var(--accent); }
.diff-btn .diff-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.diff-btn.active .diff-label { color: rgba(255,255,255,0.7); }

/* Puzzle List */
.puzzle-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px; }
.puzzle-item {
  background: var(--bg-card); border-radius: 14px;
  padding: 16px; cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.puzzle-item:hover {
  background: var(--bg-card-hover); border-color: var(--accent);
  transform: translateX(4px);
}
.puzzle-item .puzzle-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.puzzle-tag {
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  background: rgba(108,92,231,0.15); color: var(--accent-light);
}
.puzzle-tag.cat { background: rgba(0,184,148,0.15); color: #00b894; }
.puzzle-preview {
  font-size: 14px; line-height: 1.6; color: var(--text-secondary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.puzzle-item.solved { opacity: 0.5; }
.puzzle-item.solved::after {
  content: '✓ 已解'; float: right; font-size: 12px; color: var(--yes-color);
}

/* Game Screen */
.game { padding: 20px; padding-bottom: 100px; }
.soup-card {
  background: var(--bg-card); border-radius: 16px;
  padding: 24px; margin-bottom: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.soup-label {
  font-size: 12px; color: var(--accent-light); font-weight: 600;
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
}
.soup-text {
  font-size: 17px; line-height: 1.8; font-weight: 400;
}

.game-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding: 0 4px;
}
.question-count { font-size: 13px; color: var(--text-secondary); }
.hint-btn {
  background: rgba(108,92,231,0.15); border: 1px solid var(--accent);
  color: var(--accent-light); padding: 6px 14px; border-radius: 20px;
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.hint-btn:hover { background: var(--accent); color: white; }
.hint-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Chat Messages */
.chat-area {
  display: flex; flex-direction: column; gap: 12px;
  margin-bottom: 20px;
}
.msg {
  max-width: 85%; padding: 12px 16px; border-radius: 16px;
  font-size: 14px; line-height: 1.6;
  animation: fadeIn 0.3s ease;
}
.msg.user {
  align-self: flex-end; background: var(--accent);
  color: white; border-bottom-right-radius: 4px;
}
.msg.system {
  align-self: flex-start; background: var(--bg-card);
  border: 1px solid var(--border); border-bottom-left-radius: 4px;
}
.msg.yes { border-left: 3px solid var(--yes-color); }
.msg.no { border-left: 3px solid var(--no-color); }
.msg.irrelevant { border-left: 3px solid var(--irrelevant-color); }
.msg .answer-tag {
  font-size: 12px; font-weight: 700; margin-bottom: 4px;
  display: block;
}
.msg .answer-tag.yes { color: var(--yes-color); }
.msg .answer-tag.no { color: var(--no-color); }
.msg .answer-tag.irrelevant { color: var(--irrelevant-color); }

.typing-indicator {
  align-self: flex-start; background: var(--bg-card);
  border: 1px solid var(--border); padding: 12px 20px;
  border-radius: 16px; display: flex; gap: 6px;
}
.typing-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-secondary);
  animation: typing 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

/* Input Area */
.input-area {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  padding: 12px 20px 24px;
  background: linear-gradient(transparent, var(--bg-primary) 20%);
}
.input-row {
  display: flex; gap: 8px;
}
.input-row input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 24px; padding: 14px 20px;
  color: var(--text-primary); font-size: 15px; outline: none;
  transition: border-color 0.2s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); border: none;
  color: white; font-size: 20px; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { background: var(--accent-light); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Reveal */
.reveal-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 16px; padding: 24px;
  border: 1px solid var(--accent);
  animation: slideUp 0.5s ease;
  box-shadow: 0 0 30px var(--accent-glow);
}
.reveal-label {
  font-size: 12px; color: var(--accent-light); font-weight: 600;
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
}
.reveal-text { font-size: 15px; line-height: 1.8; }
.reveal-actions {
  display: flex; gap: 10px; margin-top: 20px;
}
.reveal-btn {
  flex: 1; padding: 14px; border-radius: 12px;
  border: none; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.reveal-btn.primary { background: var(--accent); color: white; }
.reveal-btn.secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.reveal-btn:hover { transform: translateY(-2px); }

/* Guess Button */
.guess-btn {
  width: 100%; padding: 14px; border-radius: 12px;
  background: linear-gradient(135deg, #e17055, #d63031);
  border: none; color: white; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 10px; transition: all 0.2s;
}
.guess-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(214,48,49,0.3); }

/* Hint Card */
.hint-card {
  background: rgba(108,92,231,0.1); border: 1px solid var(--accent);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
  animation: fadeIn 0.3s ease;
}
.hint-card .hint-label { font-size: 12px; color: var(--accent-light); font-weight: 600; margin-bottom: 6px; }
.hint-card .hint-text { font-size: 14px; line-height: 1.6; }

/* Settings/API Key */
.settings-area {
  background: var(--bg-card); border-radius: 14px;
  padding: 20px; margin: 20px 0;
  border: 1px solid var(--border);
}
.settings-area label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 8px; }
.settings-area input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  color: var(--text-primary); font-size: 14px; outline: none;
}
.settings-area input:focus { border-color: var(--accent); }
.settings-area .note { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
.save-key-btn {
  width: 100%; margin-top: 12px; padding: 12px;
  background: var(--accent); border: none; border-radius: 10px;
  color: white; font-size: 14px; font-weight: 600; cursor: pointer;
}

/* Random Play Button */
.random-btn {
  width: 100%; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #a29bfe);
  border: none; color: white; font-size: 16px; font-weight: 700;
  cursor: pointer; margin: 20px 0; transition: all 0.2s;
  animation: glow 2s infinite;
}
.random-btn:hover { transform: translateY(-2px); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============ GEMINI API ============
const callGemini = async (apiKey, puzzle, userQuestion, chatHistory) => {
  const systemPrompt = `你是一個海龜湯遊戲的主持人。

遊戲規則：
- 玩家看到「湯面」（謎題表面描述），需要透過提問來推理出「湯底」（真相）
- 你只能回答：「是 ✓」「不是 ✗」「無關」這三種
- 如果玩家的問題無法用是/否回答，引導他重新提問
- 不要透露湯底的任何細節
- 保持神秘感，偶爾可以加一句簡短的引導語

湯面：${puzzle.question}
湯底（機密，絕對不能透露）：${puzzle.answer}

根據湯底來判斷玩家的問題，回答「是 ✓」「不是 ✗」或「無關」。
回答格式：先寫判斷（是 ✓ / 不是 ✗ / 無關），然後可以加一句簡短引導（20字以內）。`;

  const messages = chatHistory.map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.text }]
  }));
  messages.push({ role: 'user', parts: [{ text: userQuestion }] });

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: messages,
        generationConfig: { temperature: 0.3, maxOutputTokens: 100 }
      })
    }
  );
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
};

const getHint = async (apiKey, puzzle, questionCount) => {
  const prompt = `你是海龜湯遊戲主持人，玩家已經問了${questionCount}個問題還沒猜出來。
湯面：${puzzle.question}
湯底：${puzzle.answer}

你必須根據湯底的內容，給玩家一個有意義的提示。提示必須和湯底有直接關聯，能幫助玩家猜到真相。

規則：
1. 提示必須和湯底的核心真相有關，引導玩家往正確方向思考
2. 不能直接說出湯底的答案，但要暗示關鍵線索
3. 用一句完整的中文句子回答，15到30個字
4. 只輸出提示本身，不要加任何前綴如「提示：」「好的」等`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 200 }
      })
    }
  );
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
};

// ============ CATEGORY CONFIG ============
const CATEGORY_MAP = {
  '溫馨感人': { emoji: '🥰', color: '#fdcb6e' },
  '懸疑推理': { emoji: '🔍', color: '#74b9ff' },
  '恐怖驚悚': { emoji: '👻', color: '#d63031' },
  '搞笑幽默': { emoji: '😂', color: '#00b894' },
  '悲劇感人': { emoji: '😢', color: '#636e72' },
  '愛情浪漫': { emoji: '💕', color: '#e84393' },
  '心理驚悚': { emoji: '🧠', color: '#6c5ce7' },
  '家庭親情': { emoji: '👨‍👩‍👧', color: '#fdcb6e' },
  '職場怪事': { emoji: '💼', color: '#00cec9' },
  '犯罪推理': { emoji: '🔪', color: '#d63031' },
  '校園奇談': { emoji: '🏫', color: '#0984e3' },
  '科幻奇幻': { emoji: '🚀', color: '#a29bfe' },
  '黑色幽默': { emoji: '🖤', color: '#2d3436' },
  '日常怪談': { emoji: '🏠', color: '#ffeaa7' },
  '靈異事件': { emoji: '👁️', color: '#fd79a8' },
};

// ============ COMPONENTS ============

function Header({ title, onBack, rightAction }) {
  return (
    <div className="header">
      {onBack ? <button className="back-btn" onClick={onBack}>←</button> : <div style={{width:36}}/>}
      <div className="header-title"><span>🐢</span> {title || '海龜湯'}</div>
      {rightAction || <div style={{width:36}}/>}
    </div>
  );
}

function HomeScreen({ onSelectCategory, onSelectDifficulty, onRandomPlay, onOpenSettings, solvedIds }) {
  const categories = {};
  PUZZLES.forEach(p => {
    if (!categories[p.category]) categories[p.category] = [];
    categories[p.category].push(p);
  });

  const totalSolved = solvedIds.size;

  return (
    <div className="home fade-in">
      <div className="hero">
        <div className="hero-icon">🐢</div>
        <h1>海龜<span>湯</span></h1>
        <p>一句話的謎題，一整個故事的真相<br/>用「是」或「否」揭開隱藏的湯底</p>
      </div>

      <div className="stats-bar">
        <div className="stat-item">
          <div className="stat-num">{PUZZLES.length}</div>
          <div className="stat-label">題目總數</div>
        </div>
        <div className="stat-item">
          <div className="stat-num">{totalSolved}</div>
          <div className="stat-label">已解開</div>
        </div>
        <div className="stat-item">
          <div className="stat-num">{Math.round(totalSolved/PUZZLES.length*100)}%</div>
          <div className="stat-label">完成率</div>
        </div>
      </div>

      <button className="random-btn" onClick={onRandomPlay}>🎲 隨機來一題</button>

      <div className="section-title">📊 依難度</div>
      <div className="difficulty-row">
        {[
          { key: 'easy', label: '短篇', sub: '70題', emoji: '🟢' },
          { key: 'medium', label: '中篇', sub: '65題', emoji: '🟡' },
          { key: 'hard', label: '長篇', sub: '51題', emoji: '🔴' },
        ].map(d => (
          <button key={d.key} className="diff-btn" onClick={() => onSelectDifficulty(d.key)}>
            {d.emoji} {d.label}
            <div className="diff-label">{d.sub}</div>
          </button>
        ))}
      </div>

      <div className="section-title">🏷️ 依分類</div>
      <div className="category-grid">
        {Object.entries(categories).sort((a,b) => b[1].length - a[1].length).map(([cat, items]) => (
          <div key={cat} className="category-card" onClick={() => onSelectCategory(cat)}>
            <div className="emoji">{(CATEGORY_MAP[cat]||{}).emoji || '❓'}</div>
            <div className="name">{cat}</div>
            <div className="count">{items.length} 題</div>
          </div>
        ))}
      </div>

      <div style={{textAlign:'center', margin:'30px 0 10px'}}>
        <button onClick={onOpenSettings} style={{
          background:'none', border:'1px solid var(--border)', borderRadius:10,
          color:'var(--text-secondary)', padding:'10px 20px', fontSize:13, cursor:'pointer'
        }}>⚙️ API 設定</button>
      </div>
    </div>
  );
}

function PuzzleListScreen({ title, puzzles, onSelect, onBack, solvedIds }) {
  return (
    <div className="fade-in">
      <Header title={title} onBack={onBack} />
      <div style={{padding:20}}>
        <div className="puzzle-list">
          {puzzles.map(p => (
            <div key={p.id} className={`puzzle-item ${solvedIds.has(p.id) ? 'solved' : ''}`} onClick={() => onSelect(p)}>
              <div className="puzzle-meta">
                <span className="puzzle-tag">{p.type}</span>
                <span className="puzzle-tag cat">{p.category}</span>
              </div>
              <div className="puzzle-preview">{p.question}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function GameScreen({ puzzle, onBack, onSolved, apiKey }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const [hints, setHints] = useState([]);
  const [hintsUsed, setHintsUsed] = useState(0);
  const chatRef = useRef(null);
  const inputRef = useRef(null);
  const maxHints = puzzle.difficulty === 'easy' ? 2 : puzzle.difficulty === 'medium' ? 3 : 4;

  useEffect(() => {
    if (chatRef.current) {
      chatRef.current.scrollTop = chatRef.current.scrollHeight;
    }
  }, [messages, hints, loading]);

  const parseAnswer = (text) => {
    const t = text.trim();
    if (t.startsWith('是') || t.includes('是 ✓')) return 'yes';
    if (t.startsWith('不是') || t.startsWith('不') || t.includes('不是 ✗')) return 'no';
    if (t.includes('無關')) return 'irrelevant';
    return 'irrelevant';
  };

  const handleSend = async () => {
    const q = input.trim();
    if (!q || loading) return;

    if (!apiKey) {
      setMessages(prev => [...prev,
        { role: 'user', text: q },
        { role: 'system', text: '請先到設定頁面填入 Gemini API Key', type: 'irrelevant' }
      ]);
      setInput('');
      return;
    }

    setInput('');
    setMessages(prev => [...prev, { role: 'user', text: q }]);
    setLoading(true);

    try {
      const history = messages.map(m => ({ role: m.role, text: m.text }));
      const reply = await callGemini(apiKey, puzzle, q, history);
      const type = parseAnswer(reply);
      setMessages(prev => [...prev, { role: 'system', text: reply, type }]);
    } catch (err) {
      setMessages(prev => [...prev, {
        role: 'system',
        text: `出錯了：${err.message}`,
        type: 'irrelevant'
      }]);
    }
    setLoading(false);
  };

  const handleHint = async () => {
    if (hintsUsed >= maxHints || loading || !apiKey) return;
    setLoading(true);
    try {
      const hint = await getHint(apiKey, puzzle, messages.filter(m=>m.role==='user').length);
      setHints(prev => [...prev, hint]);
      setHintsUsed(prev => prev + 1);
    } catch (err) {
      setHints(prev => [...prev, '提示獲取失敗']);
    }
    setLoading(false);
  };

  const handleReveal = () => {
    setRevealed(true);
    onSolved(puzzle.id);
  };

  const questionCount = messages.filter(m => m.role === 'user').length;

  return (
    <div className="fade-in">
      <Header title={`${puzzle.type} #${puzzle.number.split('#')[1]}`} onBack={onBack} />
      <div className="game" ref={chatRef} style={{overflowY:'auto', maxHeight:'calc(100vh - 130px)'}}>
        <div className="soup-card">
          <div className="soup-label">🍲 湯面</div>
          <div className="soup-text">{puzzle.question}</div>
        </div>

        <div className="game-info">
          <span className="question-count">已提問 {questionCount} 次</span>
          <button className="hint-btn" onClick={handleHint} disabled={hintsUsed >= maxHints || loading || !apiKey}>
            💡 提示 ({hintsUsed}/{maxHints})
          </button>
        </div>

        {hints.map((h, i) => (
          <div key={i} className="hint-card">
            <div className="hint-label">💡 提示 {i+1}</div>
            <div className="hint-text">{h}</div>
          </div>
        ))}

        <div className="chat-area">
          {messages.map((m, i) => (
            <div key={i} className={`msg ${m.role} ${m.type || ''}`}>
              {m.type && m.role === 'system' && (
                <span className={`answer-tag ${m.type}`}>
                  {m.type === 'yes' ? '是 ✓' : m.type === 'no' ? '不是 ✗' : '無關'}
                </span>
              )}
              {m.text}
            </div>
          ))}
          {loading && (
            <div className="typing-indicator">
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
            </div>
          )}
        </div>

        {!revealed && (
          <button className="guess-btn" onClick={handleReveal}>
            🔓 揭曉湯底
          </button>
        )}

        {revealed && (
          <div className="reveal-card">
            <div className="reveal-label">🔮 湯底揭曉</div>
            <div className="reveal-text">{puzzle.answer}</div>
            <div className="reveal-actions">
              <button className="reveal-btn secondary" onClick={onBack}>返回列表</button>
              <button className="reveal-btn primary" onClick={() => {
                const unsolved = PUZZLES.filter(p => p.id !== puzzle.id);
                const next = unsolved[Math.floor(Math.random() * unsolved.length)];
                if (next) {
                  setMessages([]);
                  setHints([]);
                  setHintsUsed(0);
                  setRevealed(false);
                  setInput('');
                  window.__loadPuzzle && window.__loadPuzzle(next);
                }
              }}>下一題 →</button>
            </div>
          </div>
        )}
      </div>

      {!revealed && (
        <div className="input-area">
          <div className="input-row">
            <input
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSend()}
              placeholder="輸入你的問題..."
              disabled={loading}
            />
            <button className="send-btn" onClick={handleSend} disabled={loading || !input.trim()}>
              ➤
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function SettingsScreen({ apiKey, onSave, onBack }) {
  const [key, setKey] = useState(apiKey || '');
  return (
    <div className="fade-in">
      <Header title="設定" onBack={onBack} />
      <div style={{padding:20}}>
        <div className="settings-area">
          <label>Gemini API Key</label>
          <input
            type="password"
            value={key}
            onChange={e => setKey(e.target.value)}
            placeholder="輸入你的 API Key..."
          />
          <div className="note">
            免費取得：前往 <a href="https://aistudio.google.com/apikey" target="_blank" style={{color:'var(--accent-light)'}}>Google AI Studio</a> 建立 API Key。
            <br/>免費額度：每分鐘 15 次請求，足夠一般使用。
            <br/>Key 只存在你的瀏覽器中，不會上傳到任何伺服器。
          </div>
          <button className="save-key-btn" onClick={() => onSave(key)}>儲存</button>
        </div>
      </div>
    </div>
  );
}

// ============ APP ============
function App() {
  const [screen, setScreen] = useState('home');
  const [currentPuzzle, setCurrentPuzzle] = useState(null);
  const [listTitle, setListTitle] = useState('');
  const [listPuzzles, setListPuzzles] = useState([]);
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem('turtle_soup_api_key') || 'AIzaSyAt0ZY7WDnhD3rC7-4ijlO5tQj6o8fDmbE'; } catch(e) { return 'AIzaSyAt0ZY7WDnhD3rC7-4ijlO5tQj6o8fDmbE'; }
  });
  const [solvedIds, setSolvedIds] = useState(() => {
    try {
      const saved = localStorage.getItem('turtle_soup_solved');
      return saved ? new Set(JSON.parse(saved)) : new Set();
    } catch(e) { return new Set(); }
  });

  const saveSolved = (newSet) => {
    setSolvedIds(newSet);
    try { localStorage.setItem('turtle_soup_solved', JSON.stringify([...newSet])); } catch(e) {}
  };

  const saveApiKey = (key) => {
    setApiKey(key);
    try { localStorage.setItem('turtle_soup_api_key', key); } catch(e) {}
    setScreen('home');
  };

  const markSolved = (id) => {
    const newSet = new Set(solvedIds);
    newSet.add(id);
    saveSolved(newSet);
  };

  const openCategory = (cat) => {
    setListTitle(cat);
    setListPuzzles(PUZZLES.filter(p => p.category === cat));
    setScreen('list');
  };

  const openDifficulty = (diff) => {
    const labels = { easy: '短篇', medium: '中篇', hard: '長篇' };
    setListTitle(labels[diff]);
    setListPuzzles(PUZZLES.filter(p => p.difficulty === diff));
    setScreen('list');
  };

  const startGame = (puzzle) => {
    setCurrentPuzzle(puzzle);
    setScreen('game');
  };

  window.__loadPuzzle = startGame;

  const randomPlay = () => {
    const unsolved = PUZZLES.filter(p => !solvedIds.has(p.id));
    const pool = unsolved.length > 0 ? unsolved : PUZZLES;
    startGame(pool[Math.floor(Math.random() * pool.length)]);
  };

  return (
    <div className="app">
      {screen === 'home' && (
        <React.Fragment>
          <Header />
          <HomeScreen
            onSelectCategory={openCategory}
            onSelectDifficulty={openDifficulty}
            onRandomPlay={randomPlay}
            onOpenSettings={() => setScreen('settings')}
            solvedIds={solvedIds}
          />
        </React.Fragment>
      )}
      {screen === 'list' && (
        <PuzzleListScreen
          title={listTitle}
          puzzles={listPuzzles}
          onSelect={startGame}
          onBack={() => setScreen('home')}
          solvedIds={solvedIds}
        />
      )}
      {screen === 'game' && currentPuzzle && (
        <GameScreen
          key={currentPuzzle.id}
          puzzle={currentPuzzle}
          onBack={() => setScreen('home')}
          onSolved={markSolved}
          apiKey={apiKey}
        />
      )}
      {screen === 'settings' && (
        <SettingsScreen
          apiKey={apiKey}
          onSave={saveApiKey}
          onBack={() => setScreen('home')}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
