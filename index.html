<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海龜湯 - 情境猜謎</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="海龜湯">
<meta name="theme-color" content="#0f1923">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="puzzles.js"></script>
<style>
:root {
  --bg: #0f1923; --bg2: #141e2b; --bg3: #1a2838; --bg4: #1e2d40;
  --gold: #ffd93d; --gold-dim: rgba(255,217,61,0.12); --gold-md: rgba(255,217,61,0.25);
  --purple: #6c5ce7; --purple-lt: #a29bfe; --teal: #00b894; --teal-lt: #55efc4;
  --red: #e17055; --pink: #fd79a8;
  --t1: #e8e8e8; --t2: #7a8a9e; --t3: #4a5568;
  --yes: #00b894; --no: #e17055; --irr: #636e72;
  --bdr: #1e2d40; --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes typing{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
@keyframes countUp{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.fade-in{animation:fadeIn .4s ease}
.slide-up{animation:slideUp .5s ease}

/* Header */
.hdr{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(15,25,35,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr)}
.hdr-logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.hdr-logo img{width:26px;height:26px;border-radius:6px}
.hdr-logo span{color:var(--gold)}
.hdr-back{background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.2s}
.hdr-back:hover{color:var(--t1);background:var(--bg2)}
.hdr-actions{display:flex;gap:4px}
.hdr-btn{background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:8px;transition:.2s}
.hdr-btn:hover{color:var(--t1);background:var(--bg2)}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(15,25,35,.97);backdrop-filter:blur(12px);border-top:1px solid var(--bdr);padding:6px 0 env(safe-area-inset-bottom,20px);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;cursor:pointer;transition:.2s;border:none;background:none;color:var(--t3);font-size:10px;font-weight:600}
.nav-item.active{color:var(--gold)}
.nav-item .ico{font-size:20px;transition:.2s}
.nav-item.active .ico{transform:scale(1.1)}

/* Home */
.home{padding:0 20px 100px}
.banner{margin-top:14px;padding:26px 22px;border-radius:22px;background:linear-gradient(135deg,#1a2840,var(--bg2));border:1px solid var(--gold-dim);position:relative;overflow:hidden}
.banner-deco{position:absolute;top:10px;right:14px;font-size:28px;opacity:.2;animation:float 3s ease-in-out infinite}
.banner h2{font-size:24px;font-weight:800;line-height:1.4}
.banner h2 span{color:var(--gold)}
.banner .sub{font-size:12px;color:var(--t2);margin-top:6px}
.banner-btn{margin-top:16px;display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--gold);color:#000;border-radius:14px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.2s}
.banner-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,217,61,.3)}

/* Daily Challenge */
.daily{margin-top:16px;padding:18px;border-radius:18px;background:var(--bg2);border:1px solid var(--bdr);position:relative;overflow:hidden}
.daily::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--purple))}
.daily-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daily-tag{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--gold-dim);color:var(--gold);font-weight:600}
.daily-streak{font-size:11px;color:var(--teal);font-weight:600}
.daily-q{font-size:14px;line-height:1.7;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.daily-go{margin-top:12px;padding:10px 18px;background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;color:var(--gold);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;display:inline-block}
.daily-go:hover{background:var(--bg4);border-color:var(--gold-dim)}

/* Quick Grid */
.sec-label{font-size:12px;color:var(--t3);margin:20px 0 10px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-c{padding:14px 6px;text-align:center;background:var(--bg2);border-radius:14px;border:1px solid var(--bdr);cursor:pointer;transition:.2s}
.quick-c:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.quick-c .e{font-size:22px}
.quick-c .n{font-size:11px;color:var(--t3);margin-top:4px}
.quick-c .v{font-size:18px;font-weight:800;color:var(--gold);margin-top:2px}

/* Search */
.search-wrap{margin-top:16px;position:relative}
.search-input{width:100%;padding:12px 16px 12px 40px;background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;color:var(--t1);font-size:14px;outline:none;transition:.2s}
.search-input:focus{border-color:var(--gold-dim)}
.search-input::placeholder{color:var(--t3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--t3)}

/* Tabs */
.tabs{display:flex;gap:0;margin:16px 0 12px;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--bdr)}
.tab{flex:1;padding:9px;text-align:center;border-radius:10px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;transition:.2s;border:none;background:none}
.tab.active{background:var(--bg4);color:var(--gold)}

/* Category Chips */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--bdr);font-size:12px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.2s}
.cat-chip:hover{border-color:var(--gold-dim);background:var(--bg3)}

/* Story Cards */
.s-list{display:flex;flex-direction:column;gap:10px}
.s-card{padding:16px;background:var(--bg2);border-radius:16px;border-left:4px solid var(--purple);cursor:pointer;transition:.25s;border-right:1px solid var(--bdr);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);position:relative}
.s-card:hover{background:var(--bg3);transform:translateX(3px)}
.s-card.solved{opacity:.4}
.s-card .meta{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.s-card .tag{font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(108,92,231,.12);color:var(--purple-lt)}
.s-card .tag.cat{background:rgba(0,184,148,.1);color:var(--teal)}
.s-card .solved-b{font-size:10px;color:var(--yes);margin-left:auto}
.s-card .fav-btn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;opacity:.5;transition:.2s}
.s-card .fav-btn.active{opacity:1}
.s-card .fav-btn:hover{opacity:1;transform:scale(1.2)}
.s-card .preview{font-size:13px;line-height:1.7;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-card .bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.s-card .diff{font-size:10px;color:var(--t3)}
.play-i{width:28px;height:28px;border-radius:50%;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}

/* Game Screen */
.game{padding:20px;padding-bottom:110px}
.soup-card{background:linear-gradient(135deg,#1a2840,var(--bg2));border-radius:20px;padding:22px;margin-bottom:18px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
.soup-label{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.soup-text{font-size:15px;line-height:1.9}

.game-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.g-stat{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:12px}
.g-stat .timer{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.hint-btn{background:var(--gold-dim);border:1px solid var(--gold-md);color:var(--gold);padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;transition:.2s;font-weight:600}
.hint-btn:hover{background:var(--gold);color:#000}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}

.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:13px;line-height:1.6;animation:fadeIn .3s ease}
.msg.user{align-self:flex-end;background:var(--purple);color:white;border-bottom-right-radius:4px}
.msg.system{align-self:flex-start;background:var(--bg2);border:1px solid var(--bdr);border-bottom-left-radius:4px}
.msg.yes{border-left:3px solid var(--yes)}
.msg.no{border-left:3px solid var(--no)}
.msg.irrelevant{border-left:3px solid var(--irr)}
.msg .a-tag{font-size:11px;font-weight:700;margin-bottom:3px;display:block}
.msg .a-tag.yes{color:var(--yes)}
.msg .a-tag.no{color:var(--no)}
.msg .a-tag.irrelevant{color:var(--irr)}

.typing{align-self:flex-start;background:var(--bg2);border:1px solid var(--bdr);padding:11px 18px;border-radius:16px;display:flex;gap:5px}
.typing-d{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:typing 1.2s infinite}
.typing-d:nth-child(2){animation-delay:.2s}
.typing-d:nth-child(3){animation-delay:.4s}

.hint-c{background:var(--gold-dim);border:1px solid var(--gold-md);border-radius:14px;padding:13px 15px;margin-bottom:10px;animation:fadeIn .3s}
.hint-c .hl{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:5px}
.hint-c .ht{font-size:13px;line-height:1.6}

.action-row{display:flex;gap:8px;margin-top:12px}
.btn-guess{flex:1;padding:13px 16px;border-radius:14px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;background:linear-gradient(135deg,var(--gold),#f0c929);color:#000}
.btn-guess:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,217,61,.3)}
.btn-reveal{padding:13px 18px;border-radius:14px;border:1px solid var(--bdr);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;background:var(--bg2);color:var(--t2)}
.btn-reveal:hover{border-color:var(--t3)}

.guess-area{margin-top:12px;animation:fadeIn .3s}
.guess-label{font-size:12px;color:var(--gold);margin-bottom:8px;font-weight:600}
.guess-ta{width:100%;background:var(--bg2);border:1px solid var(--gold-md);border-radius:14px;padding:12px 15px;color:var(--t1);font-size:13px;outline:none;resize:none;min-height:70px;font-family:inherit;line-height:1.6}
.guess-ta:focus{border-color:var(--gold)}
.guess-submit{width:100%;margin-top:8px;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}

.reveal-card{background:linear-gradient(135deg,#1a2840,var(--bg));border-radius:20px;padding:22px;border:1px solid var(--gold-md);animation:slideUp .5s ease;box-shadow:0 0 30px var(--gold-dim)}
.reveal-label{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:2px;margin-bottom:10px}
.reveal-text{font-size:14px;line-height:1.8}
.reveal-stats{margin-top:14px;display:flex;gap:16px}
.reveal-stat{text-align:center}
.reveal-stat .rv{font-size:20px;font-weight:800;color:var(--gold)}
.reveal-stat .rl{font-size:10px;color:var(--t3);margin-top:2px}
.reveal-actions{display:flex;gap:8px;margin-top:16px}
.r-btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.r-btn.pri{background:var(--gold);color:#000}
.r-btn.sec{background:var(--bg2);color:var(--t1);border:1px solid var(--bdr)}
.r-btn.share{background:var(--teal);color:#000}
.r-btn:hover{transform:translateY(-2px)}

.win-card{border-color:var(--teal) !important;box-shadow:0 0 30px rgba(0,184,148,.15) !important}
.win-card .reveal-label{color:var(--teal)}
.confetti-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confetti 1.5s ease-out forwards}

.input-area{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 20px 10px;background:linear-gradient(transparent,var(--bg) 30%)}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;background:var(--bg2);border:1px solid var(--bdr);border-radius:22px;padding:12px 18px;color:var(--t1);font-size:14px;outline:none;transition:.2s}
.input-row input:focus{border-color:var(--gold-dim)}
.input-row input::placeholder{color:var(--t3)}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--gold);border:none;color:#000;font-size:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;font-weight:700}
.send-btn:disabled{opacity:.3;cursor:not-allowed}

/* Stats Page */
.stats-page{padding:20px 20px 100px}
.stats-hero{text-align:center;padding:24px 0 16px}
.stats-hero .big{font-size:48px;font-weight:900;color:var(--gold);animation:countUp .5s ease}
.stats-hero .label{font-size:13px;color:var(--t2);margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats-box{background:var(--bg2);border-radius:14px;padding:16px 10px;text-align:center;border:1px solid var(--bdr)}
.stats-box .sv{font-size:22px;font-weight:800;color:var(--gold)}
.stats-box .sl{font-size:10px;color:var(--t3);margin-top:2px}
.cat-progress{margin-top:20px}
.cat-prog-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bdr)}
.cat-prog-item .e{font-size:20px;width:28px}
.cat-prog-item .info{flex:1}
.cat-prog-item .name{font-size:13px;font-weight:600}
.cat-prog-item .bar{height:4px;background:var(--bdr);border-radius:2px;margin-top:4px;overflow:hidden}
.cat-prog-item .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--teal))}
.cat-prog-item .pct{font-size:11px;color:var(--t3);width:36px;text-align:right}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ach-card{background:var(--bg2);border-radius:14px;padding:16px 8px;text-align:center;border:1px solid var(--bdr);transition:.2s}
.ach-card.unlocked{border-color:var(--gold-dim);background:linear-gradient(180deg,rgba(255,217,61,.05),transparent)}
.ach-card .ach-icon{font-size:28px;filter:grayscale(1) opacity(.3)}
.ach-card.unlocked .ach-icon{filter:none}
.ach-card .ach-name{font-size:10px;color:var(--t3);margin-top:6px;line-height:1.3}
.ach-card.unlocked .ach-name{color:var(--t1)}

/* Favorites Page */
.fav-empty{text-align:center;padding:60px 20px;color:var(--t3)}
.fav-empty .e{font-size:48px;opacity:.3;margin-bottom:12px}
.fav-empty p{font-size:14px}

/* History */
.hist-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bdr)}
.hist-item .h-cat{font-size:20px;width:28px}
.hist-item .h-info{flex:1}
.hist-item .h-q{font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hist-item .h-meta{font-size:11px;color:var(--t3);margin-top:2px}
.hist-item .h-result{font-size:18px}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ============ API ============
const _dk = [65,73,122,97,83,121,68,65,103,112,85,75,70,113,55,117,111,111,75,49,86,117,118,53,111,53,102,107,65,67,75,80,73,102,53,54,45,103,119];
const getKey = () => { try { const k = localStorage.getItem('ts_k'); if(k) return k; } catch(e){} return _dk.map(c=>String.fromCharCode(c)).join(''); };
const MODEL = 'gemini-2.5-flash';
const apiUrl = () => `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${getKey()}`;
const parse = (data) => { const pp = data.candidates[0].content.parts; return pp.filter(p=>p.text).pop().text; };

const callAI = async (prompt, system, history, temp=0.3) => {
  const body = { generationConfig: { temperature: temp, maxOutputTokens: 1024 } };
  if (system) body.system_instruction = { parts: [{ text: system }] };
  if (history) {
    body.contents = [...history.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] })), { role: 'user', parts: [{ text: prompt }] }];
  } else {
    body.contents = [{ role: 'user', parts: [{ text: prompt }] }];
  }
  const res = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return parse(data);
};

const askQuestion = (puzzle, q, history) => callAI(q, `你是海龜湯遊戲的主持人。
遊戲規則：玩家看到「湯面」，透過提問推理「湯底」。你只能回答「是 ✓」「不是 ✗」「無關」三種。不要透露湯底的任何細節。偶爾加一句20字以內的簡短引導。
湯面：${puzzle.question}
湯底（絕對機密）：${puzzle.answer}
回答格式：判斷（是 ✓ / 不是 ✗ / 無關）+ 簡短引導。`, history, 0.3);

const getHint = (puzzle, qCount) => callAI(`你是海龜湯主持人，玩家問了${qCount}個問題還沒猜到。
湯面：${puzzle.question}
湯底：${puzzle.answer}
給一個和湯底核心真相有關的提示，暗示關鍵線索但不直接說答案。用一句完整中文，15-30字。只輸出提示，不加前綴。`, null, null, 0.7);

const judgeGuess = (puzzle, guess) => callAI(`你是海龜湯裁判。
湯面：${puzzle.question}
湯底：${puzzle.answer}
玩家猜測：${guess}
判斷玩家是否猜到核心真相（不需完全一致，猜到關鍵要素即正確）。
用以下格式回答一行：
🎉 正確！[簡短說明]
🤏 很接近！[差什麼]
❌ 還沒猜到！[簡短引導]`, null, null, 0.2);

// ============ DATA ============
const CAT = {

// ============ STORE ============
const useStore = () => {
  const load = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const [solvedIds, setSolvedIds] = useState(() => new Set(load('ts_solved', [])));
  const [favIds, setFavIds] = useState(() => new Set(load('ts_favs', [])));
  const [history, setHistory] = useState(() => load('ts_history', []));
  const [stats, setStats] = useState(() => load('ts_stats', { totalQ: 0, totalHints: 0, minQ: 999, noHintWin: 0, streak: 0, maxStreak: 0 }));

  const markSolved = (id, qCount, hintCount, won) => {
    const ns = new Set(solvedIds); ns.add(id);
    setSolvedIds(ns); save('ts_solved', [...ns]);

    const catsSolved = new Set();
    PUZZLES.filter(p => ns.has(p.id)).forEach(p => catsSolved.add(p.category));

    const newStats = {
      ...stats,
      totalQ: stats.totalQ + qCount,
      totalHints: stats.totalHints + hintCount,
      minQ: won ? Math.min(stats.minQ, qCount) : stats.minQ,
      noHintWin: (won && hintCount === 0) ? stats.noHintWin + 1 : stats.noHintWin,
      streak: won ? stats.streak + 1 : 0,
      maxStreak: won ? Math.max(stats.maxStreak, stats.streak + 1) : stats.maxStreak,
      catCount: catsSolved.size,
      solved: ns.size,
    };
    setStats(newStats); save('ts_stats', newStats);

    const entry = { id, date: new Date().toISOString().slice(0,10), qCount, hintCount, won };
    const nh = [entry, ...history.slice(0, 99)];
    setHistory(nh); save('ts_history', nh);
  };

  const toggleFav = (id) => {
    const nf = new Set(favIds);
    nf.has(id) ? nf.delete(id) : nf.add(id);
    setFavIds(nf); save('ts_favs', [...nf]);
  };

  return { solvedIds, favIds, history, stats: { ...stats, solved: solvedIds.size }, markSolved, toggleFav };
};

// ============ DAILY ============
const getDailyPuzzle = () => {
  const today = new Date();
  const seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
  return PUZZLES[seed % PUZZLES.length];
};

function HomeScreen({ store, onPlay, onCategory, onDifficulty }) {
  const [tab, setTab] = useState('recommend');
  const [search, setSearch] = useState('');
  const daily = useMemo(getDailyPuzzle, []);
  const dailySolved = store.solvedIds.has(daily.id);

  const categories = useMemo(() => {
    const c = {};
    PUZZLES.forEach(p => { if(!c[p.category]) c[p.category]=[]; c[p.category].push(p); });
    return c;
  }, []);

  const recommended = useMemo(() => {
    const unsolved = PUZZLES.filter(p => !store.solvedIds.has(p.id));
    return (unsolved.length > 0 ? unsolved : PUZZLES).sort(() => Math.random() - 0.5).slice(0, 8);
  }, [store.solvedIds.size]);

  const getList = () => {
    let list;
    if (tab === 'recommend') list = recommended;
    else if (tab === 'easy') list = PUZZLES.filter(p => p.difficulty === 'easy');
    else if (tab === 'medium') list = PUZZLES.filter(p => p.difficulty === 'medium');
    else list = PUZZLES.filter(p => p.difficulty === 'hard');
    if (search) list = list.filter(p => p.question.includes(search) || p.category.includes(search));
    return list;
  };

  return (
    <div className="home fade-in">
      <div className="banner">
        <div className="banner-deco">✨🌙</div>
        <h2>今晚<span>來解</span><br/>一個謎題？</h2>
        <div className="sub">{PUZZLES.length} 道謎題 · 已解 {store.stats.solved} 題 · {Math.round(store.stats.solved/PUZZLES.length*100)}%</div>
        <button className="banner-btn" onClick={() => {
          const unsolved = PUZZLES.filter(p => !store.solvedIds.has(p.id));
          const pool = unsolved.length > 0 ? unsolved : PUZZLES;
          onPlay(pool[Math.floor(Math.random() * pool.length)]);
        }}>🎲 隨機開始</button>
      </div>

      <div className="daily">
        <div className="daily-hdr">
          <span className="daily-tag">🔮 今日挑戰</span>
          {dailySolved && <span className="daily-streak">✓ 已完成</span>}
        </div>
        <div className="daily-q">{daily.question}</div>
        <button className="daily-go" onClick={() => onPlay(daily)}>{dailySolved ? '再玩一次' : '開始推理'} →</button>
      </div>

      <div className="sec-label">⚡ 快速開始</div>
      <div className="quick">
        <div className="quick-c" onClick={() => onDifficulty('easy')}><div className="e">🟢</div><div className="n">短篇</div><div className="v">70</div></div>
        <div className="quick-c" onClick={() => onDifficulty('medium')}><div className="e">🟡</div><div className="n">中篇</div><div className="v">65</div></div>
        <div className="quick-c" onClick={() => onDifficulty('hard')}><div className="e">🔴</div><div className="n">長篇</div><div className="v">51</div></div>
        <div className="quick-c" onClick={() => onDifficulty('all')}><div className="e">📖</div><div className="n">全部</div><div className="v">{PUZZLES.length}</div></div>
      </div>

      <div className="sec-label">📂 分類</div>
      <div className="cat-scroll">
        {Object.entries(categories).sort((a,b) => b[1].length - a[1].length).map(([cat, items]) => (
          <div key={cat} className="cat-chip" onClick={() => onCategory(cat)}>
            <span>{(CAT[cat]||{}).e||'❓'}</span>{cat} ({items.length})
          </div>
        ))}
      </div>

      <div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input className="search-input" placeholder="搜尋題目..." value={search} onChange={e => setSearch(e.target.value)} />
      </div>

      <div className="tabs">
        {[{k:'recommend',l:'推薦'},{k:'easy',l:'短篇'},{k:'medium',l:'中篇'},{k:'hard',l:'長篇'}].map(t => (
          <button key={t.k} className={`tab ${tab===t.k?'active':''}`} onClick={() => setTab(t.k)}>{t.l}</button>
        ))}
      </div>

      <div className="s-list">
        {getList().map((p, i) => (
          <PuzzleCard key={p.id} puzzle={p} i={i} solved={store.solvedIds.has(p.id)} fav={store.favIds.has(p.id)} onFav={() => store.toggleFav(p.id)} onClick={() => onPlay(p)} />
        ))}
      </div>
    </div>
  );

function GameScreen({ puzzle, onBack, store }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const [hints, setHints] = useState([]);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [guessMode, setGuessMode] = useState(false);
  const [guessInput, setGuessInput] = useState('');
  const [won, setWon] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const chatRef = useRef(null);
  const timerRef = useRef(null);
  const maxH = puzzle.difficulty === 'easy' ? 2 : puzzle.difficulty === 'medium' ? 3 : 4;

  useEffect(() => {
    timerRef.current = setInterval(() => setSeconds(s => s + 1), 1000);
    return () => clearInterval(timerRef.current);
  }, []);

  useEffect(() => {
    if (won || revealed) clearInterval(timerRef.current);
  }, [won, revealed]);

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [msgs, hints, loading]);

  const fmtTime = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const qCount = msgs.filter(m => m.role === 'user').length;

  const parseType = (t) => {
    if (t.startsWith('是') || t.includes('是 ✓')) return 'yes';
    if (t.startsWith('不是') || t.startsWith('不') || t.includes('不是 ✗')) return 'no';
    return 'irrelevant';
  };

  const handleSend = async () => {
    const q = input.trim(); if (!q || loading) return;
    setInput('');
    setMsgs(p => [...p, { role: 'user', text: q }]);
    setLoading(true);
    try {
      const reply = await askQuestion(puzzle, q, msgs);
      setMsgs(p => [...p, { role: 'system', text: reply, type: parseType(reply) }]);
    } catch (e) { setMsgs(p => [...p, { role: 'system', text: `錯誤：${e.message}`, type: 'irrelevant' }]); }
    setLoading(false);
  };

  const handleHint = async () => {
    if (hintsUsed >= maxH || loading) return;
    setLoading(true);
    try { const h = await getHint(puzzle, qCount); setHints(p => [...p, h]); setHintsUsed(p => p + 1); }
    catch (e) { setHints(p => [...p, '提示失敗：' + e.message]); }
    setLoading(false);
  };

  const handleGuess = async () => {
    const g = guessInput.trim(); if (!g || loading) return;
    setLoading(true);
    try {
      const result = await judgeGuess(puzzle, g);
      setMsgs(p => [...p, { role: 'user', text: `【猜答案】${g}` }, { role: 'system', text: result, type: result.includes('🎉') ? 'yes' : result.includes('🤏') ? 'irrelevant' : 'no' }]);
      if (result.includes('🎉')) { setWon(true); setShowConfetti(true); store.markSolved(puzzle.id, qCount, hintsUsed, true); setTimeout(() => setShowConfetti(false), 2000); }
    } catch (e) { setMsgs(p => [...p, { role: 'system', text: `錯誤：${e.message}`, type: 'irrelevant' }]); }
    setLoading(false); setGuessInput(''); setGuessMode(false);
  };

  const handleReveal = () => { setRevealed(true); store.markSolved(puzzle.id, qCount, hintsUsed, false); };

  const handleShare = () => {
    const text = `🐢 海龜湯挑戰\n\n${puzzle.question}\n\n你能猜到真相嗎？\n👉 https://eve8281-sudo.github.io/turtle-soup-game/`;
    if (navigator.share) navigator.share({ text });
    else { navigator.clipboard.writeText(text); alert('已複製到剪貼簿！'); }
  };

  const nextPuzzle = () => {
    const unsolved = PUZZLES.filter(p => p.id !== puzzle.id && !store.solvedIds.has(p.id));
    const pool = unsolved.length > 0 ? unsolved : PUZZLES.filter(p => p.id !== puzzle.id);
    const next = pool[Math.floor(Math.random() * pool.length)];
    if (next) window.__loadPuzzle?.(next);
  };

  return (
    <div className="fade-in">
      {showConfetti && <Confetti />}
      <Header title={`${puzzle.type} #${puzzle.number.split('#')[1]}`} onBack={onBack} />
      <div className="game" ref={chatRef} style={{overflowY:'auto',maxHeight:'calc(100vh - 130px)'}}>
        <div className="soup-card">
          <div className="soup-label">🍲 湯面</div>
          <div className="soup-text">{puzzle.question}</div>
        </div>

        <div className="game-bar">
          <div className="g-stat">
            <span>❓ {qCount}</span>
            <span className="timer">⏱ {fmtTime(seconds)}</span>
          </div>
          <button className="hint-btn" onClick={handleHint} disabled={hintsUsed>=maxH||loading}>💡 提示 ({hintsUsed}/{maxH})</button>
        </div>

        {hints.map((h,i) => <div key={i} className="hint-c"><div className="hl">💡 提示 {i+1}</div><div className="ht">{h}</div></div>)}

        <div className="chat">
          {msgs.map((m,i) => (
            <div key={i} className={`msg ${m.role} ${m.type||''}`}>
              {m.type && m.role==='system' && <span className={`a-tag ${m.type}`}>{m.type==='yes'?'是 ✓':m.type==='no'?'不是 ✗':'無關'}</span>}
              {m.text}
            </div>
          ))}
          {loading && <div className="typing"><div className="typing-d"/><div className="typing-d"/><div className="typing-d"/></div>}
        </div>

        {!revealed && !won && (
          <div className="action-row">
            <button className="btn-guess" onClick={() => setGuessMode(!guessMode)}>🧠 {guessMode ? '取消' : '我知道答案了'}</button>
            <button className="btn-reveal" onClick={handleReveal}>🔓 揭曉</button>
          </div>
        )}

        {guessMode && !revealed && !won && (
          <div className="guess-area">
            <div className="guess-label">✍️ 寫下你猜的湯底：</div>
            <textarea className="guess-ta" value={guessInput} onChange={e=>setGuessInput(e.target.value)} placeholder="描述你猜到的真相..." />
            <button className="guess-submit" onClick={handleGuess} disabled={loading||!guessInput.trim()} style={{background:guessInput.trim()?'var(--gold)':'var(--bdr)',color:guessInput.trim()?'#000':'var(--t3)',cursor:guessInput.trim()?'pointer':'not-allowed'}}>
              {loading ? '判定中...' : '提交答案'}
            </button>
          </div>
        )}

        {won && !revealed && (
          <div className="reveal-card win-card slide-up" style={{marginTop:14}}>
            <div className="reveal-label">🎉 恭喜猜對了！</div>
            <div className="reveal-text">{puzzle.answer}</div>
            <div className="reveal-stats">
              <div className="reveal-stat"><div className="rv">{qCount}</div><div className="rl">提問次數</div></div>
              <div className="reveal-stat"><div className="rv">{hintsUsed}</div><div className="rl">使用提示</div></div>
              <div className="reveal-stat"><div className="rv">{fmtTime(seconds)}</div><div className="rl">用時</div></div>
            </div>
            <div className="reveal-actions">
              <button className="r-btn share" onClick={handleShare}>📤 分享</button>
              <button className="r-btn sec" onClick={onBack}>返回</button>
              <button className="r-btn pri" onClick={nextPuzzle}>下一題 →</button>
            </div>
          </div>
        )}

        {revealed && (
          <div className="reveal-card slide-up" style={{marginTop:14}}>
            <div className="reveal-label">🔮 湯底揭曉</div>
            <div className="reveal-text">{puzzle.answer}</div>
            <div className="reveal-stats">
              <div className="reveal-stat"><div className="rv">{qCount}</div><div className="rl">提問次數</div></div>
              <div className="reveal-stat"><div className="rv">{fmtTime(seconds)}</div><div className="rl">用時</div></div>
            </div>
            <div className="reveal-actions">
              <button className="r-btn share" onClick={handleShare}>📤 分享</button>
              <button className="r-btn sec" onClick={onBack}>返回</button>
              <button className="r-btn pri" onClick={nextPuzzle}>下一題 →</button>
            </div>
          </div>
        )}
      </div>

      {!revealed && !won && !guessMode && (
        <div className="input-area">
          <div className="input-row">
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="輸入你的問題..." disabled={loading} />
            <button className="send-btn" onClick={handleSend} disabled={loading||!input.trim()}>➤</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const unlockedAch = ACHIEVEMENTS.filter(a => a.check(store.stats));

  return (
    <div className="stats-page fade-in">
      <div className="stats-hero">
        <div className="big">{store.stats.solved}</div>
        <div className="label">已解開的謎題</div>
      </div>
      <div className="stats-grid">
        <div className="stats-box"><div className="sv">{store.stats.totalQ}</div><div className="sl">總提問數</div></div>
        <div className="stats-box"><div className="sv">{store.stats.totalHints}</div><div className="sl">使用提示</div></div>
        <div className="stats-box"><div className="sv">{store.stats.maxStreak}</div><div className="sl">最高連勝</div></div>
        <div className="stats-box"><div className="sv">{store.stats.minQ < 999 ? store.stats.minQ : '-'}</div><div className="sl">最少提問</div></div>
        <div className="stats-box"><div className="sv">{store.stats.noHintWin || 0}</div><div className="sl">無提示猜對</div></div>
        <div className="stats-box"><div className="sv">{Math.round(store.stats.solved/PUZZLES.length*100)}%</div><div className="sl">完成率</div></div>
      </div>

      <div className="sec-label">🏆 成就 ({unlockedAch.length}/{ACHIEVEMENTS.length})</div>
      <div className="ach-grid">
        {ACHIEVEMENTS.map(a => {
          const unlocked = a.check(store.stats);
          return (
            <div key={a.id} className={`ach-card ${unlocked?'unlocked':''}`}>
              <div className="ach-icon">{a.icon}</div>
              <div className="ach-name">{a.name}</div>
            </div>
          );
        })}
      </div>

      <div className="sec-label">📂 分類進度</div>
      <div className="cat-progress">
        {Object.entries(categories).sort((a,b) => b[1].length - a[1].length).map(([cat, items]) => {
          const solved = items.filter(p => store.solvedIds.has(p.id)).length;
          const pct = Math.round(solved / items.length * 100);
          return (
            <div key={cat} className="cat-prog-item">
              <span className="e">{(CAT[cat]||{}).e||'❓'}</span>
              <div className="info">
                <div className="name">{cat} ({solved}/{items.length})</div>
                <div className="bar"><div className="bar-fill" style={{width:pct+'%'}} /></div>
              </div>
              <span className="pct">{pct}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function FavsScreen({ store, onPlay }) {
  const favPuzzles = PUZZLES.filter(p => store.favIds.has(p.id));
  return (
    <div style={{padding:'16px 20px 100px'}} className="fade-in">
      {favPuzzles.length === 0 ? (
        <div className="fav-empty"><div className="e">⭐</div><p>還沒有收藏的題目<br/>在題目列表按 ☆ 收藏</p></div>
      ) : (
        <div className="s-list">
          {favPuzzles.map((p, i) => (
            <PuzzleCard key={p.id} puzzle={p} i={i} solved={store.solvedIds.has(p.id)} fav={true} onFav={() => store.toggleFav(p.id)} onClick={() => onPlay(p)} />
          ))}
        </div>
      )}
    </div>
  );
}

function HistoryScreen({ store, onPlay }) {
  return (
    <div style={{padding:'16px 20px 100px'}} className="fade-in">
      {store.history.length === 0 ? (
        <div className="fav-empty"><div className="e">📜</div><p>還沒有解題紀錄</p></div>
      ) : (
        <div>
          {store.history.map((h, i) => {
            const p = PUZZLES.find(x => x.id === h.id);
            if (!p) return null;
            return (
              <div key={i} className="hist-item" onClick={() => onPlay(p)} style={{cursor:'pointer'}}>
                <span className="h-cat">{(CAT[p.category]||{}).e||'❓'}</span>
                <div className="h-info">
                  <div className="h-q">{p.question}</div>
                  <div className="h-meta">{h.date} · {h.qCount}題 · {h.hintCount}提示</div>
                </div>
                <span className="h-result">{h.won ? '🎉' : '🔓'}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============ APP ============
function App() {
  const [screen, setScreen] = useState('home');
  const [puzzle, setPuzzle] = useState(null);
  const [listTitle, setListTitle] = useState('');
  const [listPuzzles, setListPuzzles] = useState([]);
  const store = useStore();

  const play = (p) => { setPuzzle(p); setScreen('game'); };
  window.__loadPuzzle = play;

  const goHome = () => setScreen('home');
  const showNav = screen !== 'game';

  return (
    <div className="app">
      {screen === 'home' && <>
        <Header />
        <HomeScreen store={store} onPlay={play}
          onCategory={cat => { setListTitle(cat); setListPuzzles(PUZZLES.filter(p => p.category === cat)); setScreen('list'); }}
          onDifficulty={d => {
            if (d === 'all') { setListTitle('全部題目'); setListPuzzles(PUZZLES); }
            else { const l = {easy:'短篇',medium:'中篇',hard:'長篇'}; setListTitle(l[d]); setListPuzzles(PUZZLES.filter(p => p.difficulty === d)); }
            setScreen('list');
          }}
        />
      </>}
      {screen === 'list' && <PuzzleListScreen title={listTitle} puzzles={listPuzzles} store={store} onSelect={play} onBack={goHome} />}
      {screen === 'game' && puzzle && <GameScreen key={puzzle.id} puzzle={puzzle} onBack={goHome} store={store} />}
      {screen === 'stats' && <><Header title="統計" /><StatsScreen store={store} /></>}
      {screen === 'favs' && <><Header title="收藏" /><FavsScreen store={store} onPlay={play} /></>}
      {screen === 'history' && <><Header title="紀錄" /><HistoryScreen store={store} onPlay={play} /></>}
      {showNav && <BottomNav screen={screen} onChange={setScreen} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
